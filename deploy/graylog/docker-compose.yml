services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - graylog

  graylog:
    image: graylog/graylog:${GRAYLOG_VERSION:-7.1.9}
    hostname: graylog
    restart: unless-stopped
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_HTTP_EXTERNAL_URI}
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      # Points Graylog at the existing Wazuh Indexer OpenSearch cluster instead
      # of running Graylog's own Data Node, so gl-events* lands in the same
      # cluster CoPilot's Wazuh-Indexer connector already queries. Credentials
      # are embedded in the URL: scheme://user:pass@host:port. See
      # deploy/graylog/.env.example for the required OpenSearch role caveat.
      GRAYLOG_ELASTICSEARCH_HOSTS: ${GRAYLOG_ELASTICSEARCH_HOSTS}
      # Wazuh's opensearch.yml sets compatibility.override_main_response_version
      # (for Filebeat-oss, unrelated to Graylog), which makes the indexer's
      # root endpoint falsely report itself as Elasticsearch 7.10.2. Graylog's
      # automatic version probe trusts that and picks the wrong query dialect,
      # which surfaces as "key [types] is not supported in the metadata
      # section" on Input Diagnostics, Search, etc. Setting this disables the
      # probe entirely -- see deploy/graylog/.env.example for the full story.
      GRAYLOG_ELASTICSEARCH_VERSION: ${GRAYLOG_ELASTICSEARCH_VERSION:-opensearch:2.0.0}
    # Wazuh's certificate is issued to a role name (e.g. "wazuh.indexer"), not
    # an IP, and Java's TLS hostname verification requires the connection
    # host to match that name even once the certificate itself is trusted
    # (via /certificates below). deploy/graylog/start.sh/.ps1 read the name
    # out of the fetched certificate, switch GRAYLOG_ELASTICSEARCH_HOSTS to
    # use it, and set these two so Docker can still resolve it.
    extra_hosts:
      - "${GRAYLOG_WAZUH_INDEXER_HOSTNAME:-wazuh-indexer-hostname-unset}:${GRAYLOG_WAZUH_INDEXER_IP:-127.0.0.1}"
    volumes:
      - graylog-data:/usr/share/graylog/data
      # Graylog's Java HTTP client rejects the Wazuh Indexer's self-signed
      # certificate by default (there is no elasticsearch_ssl_verify=false
      # equivalent). The official image's own entrypoint imports every *.crt
      # file under /certificates into its JVM truststore on every start --
      # deploy/graylog/start.sh/.ps1 fetch the Wazuh Indexer's certificate
      # into ./certificates before this container is created. Do not run
      # `docker compose up` directly here on a fresh checkout; that
      # directory will be empty and Graylog will keep rejecting the cert.
      - ./certificates:/certificates:ro
    ports:
      - "${GRAYLOG_HTTP_PORT:-9000}:9000"
      - "${GRAYLOG_SYSLOG_UDP_PORT:-2514}:1514/udp"
      - "${GRAYLOG_SYSLOG_TCP_PORT:-2515}:1514/tcp"
    depends_on:
      - mongodb
    networks:
      - graylog

volumes:
  mongodb-data:
  graylog-data:

networks:
  graylog:
    driver: bridge
