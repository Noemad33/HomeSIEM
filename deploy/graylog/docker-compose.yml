services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - graylog

  graylog:
    image: graylog/graylog:${GRAYLOG_VERSION:-7.1.9}
    hostname: graylog
    restart: unless-stopped
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_HTTP_EXTERNAL_URI}
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      # Points Graylog at the existing Wazuh Indexer OpenSearch cluster instead
      # of running Graylog's own Data Node, so gl-events* lands in the same
      # cluster CoPilot's Wazuh-Indexer connector already queries. Credentials
      # are embedded in the URL: scheme://user:pass@host:port. See
      # deploy/graylog/.env.example for the required OpenSearch role caveat.
      GRAYLOG_ELASTICSEARCH_HOSTS: ${GRAYLOG_ELASTICSEARCH_HOSTS}
      # Graylog's Java HTTP client rejects the Wazuh Indexer's self-signed
      # certificate by default (there is no elasticsearch_ssl_verify=false
      # equivalent). graylog-truststore.jks is generated by
      # deploy/graylog/start.sh/.ps1 -- do not run `docker compose up`
      # directly here on a fresh checkout, that file will not exist yet.
      GRAYLOG_SERVER_JAVA_OPTS: "-Djavax.net.ssl.trustStore=/etc/graylog/graylog-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"
    volumes:
      - graylog-data:/usr/share/graylog/data
      - ./graylog-truststore.jks:/etc/graylog/graylog-truststore.jks:ro
    ports:
      - "${GRAYLOG_HTTP_PORT:-9000}:9000"
      - "${GRAYLOG_SYSLOG_UDP_PORT:-2514}:1514/udp"
      - "${GRAYLOG_SYSLOG_TCP_PORT:-2515}:1514/tcp"
    depends_on:
      - mongodb
    networks:
      - graylog

volumes:
  mongodb-data:
  graylog-data:

networks:
  graylog:
    driver: bridge
