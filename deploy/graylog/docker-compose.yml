services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - graylog

  graylog-datanode:
    image: graylog/graylog-datanode:6.2
    hostname: graylog-datanode
    restart: unless-stopped
    environment:
      GRAYLOG_DATANODE_NODE_ID_FILE: /var/lib/graylog-datanode/node-id
      GRAYLOG_DATANODE_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_DATANODE_MONGODB_URI: mongodb://mongodb:27017/graylog
    volumes:
      - graylog-datanode-data:/var/lib/graylog-datanode
    depends_on:
      - mongodb
    networks:
      - graylog

  graylog:
    image: graylog/graylog:6.2
    hostname: graylog
    restart: unless-stopped
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_HTTP_EXTERNAL_URI}
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      GRAYLOG_DATANODE_DATA_DIR: /var/lib/graylog-datanode
    volumes:
      - graylog-data:/usr/share/graylog/data
    ports:
      - "${GRAYLOG_HTTP_PORT:-9000}:9000"
      - "${GRAYLOG_SYSLOG_UDP_PORT:-2514}:1514/udp"
      - "${GRAYLOG_SYSLOG_TCP_PORT:-2515}:1514/tcp"
    depends_on:
      - mongodb
      - graylog-datanode
    networks:
      - graylog

volumes:
  mongodb-data:
  graylog-data:
  graylog-datanode-data:

networks:
  graylog:
    driver: bridge
